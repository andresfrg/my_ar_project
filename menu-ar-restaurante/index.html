<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>La Casona Verde · Menú AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />

    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="restaurant-pill">Menú digital · AR</div>
      <h1 class="restaurant-name">La Casona Verde</h1>
      <p class="restaurant-subtitle">
        Explora nuestros platos y postres en realidad aumentada. Precios en pesos colombianos (COP).
      </p>
    </header>

    <main class="app-main">
      <section class="menu-shell">
        <div class="menu-header">
          <h2 class="menu-title">Carta</h2>
          <p class="menu-subtitle">
            Elige una categoría y visualiza los platos sobre tu mesa.
          </p>
        </div>

        <nav id="menu-tabs" class="menu-tabs"></nav>
        <section id="menu" class="menu-section"></section>
      </section>
    </main>

    <footer class="app-footer">
      <p>La Casona Verde · Menú AR</p>
    </footer>

    <!-- Script principal: el import de model-viewer será dinámico dentro de app.js -->
    <script type="module" src="app.js" defer></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Menú AR – Demo Restaurante</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />

    <!-- model-viewer (para 3D + AR) -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="restaurant-name">Restaurante Demo</h1>
      <p class="restaurant-subtitle">
        Escanea el código QR y explora nuestros platos en realidad aumentada.
      </p>
    </header>

    <main class="app-main">
      <section id="menu" class="menu-section">
        <!-- Aquí se inyectan los platos desde app.js -->
      </section>
    </main>

    <footer class="app-footer">
      <p>Demo AR · Innovaryx</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>

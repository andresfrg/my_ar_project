<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>La Casona Verde · Menú AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css" />

    <!-- model-viewer (para 3D + AR) -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="restaurant-pill">Menú digital · AR</div>
      <h1 class="restaurant-name">La Casona Verde</h1>
      <p class="restaurant-subtitle">
        Explora nuestros platos y postres en realidad aumentada. Precios en pesos colombianos (COP).
      </p>
    </header>

    <main class="app-main">
      <section class="menu-shell">
        <div class="menu-header">
          <h2 class="menu-title">Carta</h2>
          <p class="menu-subtitle">
            Elige una categoría y visualiza los platos sobre tu mesa.
          </p>
        </div>

        <nav id="menu-tabs" class="menu-tabs">
          <!-- Se llena desde app.js -->
        </nav>

        <section id="menu" class="menu-section">
          <!-- Aquí se inyectan los platos desde app.js -->
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <p>La Casona Verde · Menú AR</p>
      <p class="developer-credit">
        Desarrollado por <strong>Innovaryx</strong>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
